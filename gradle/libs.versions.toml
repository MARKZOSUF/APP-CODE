# Gradle Version Catalog.
#
# These versions are a mutually compatible, stable set:
#   * AGP 8.7.x requires Gradle 8.9+ and JDK 17.
#   * Kotlin 2.0.21 ships the Compose compiler as a Kotlin plugin
#     (org.jetbrains.kotlin.plugin.compose), so no separate compiler
#     extension version is pinned.
#   * KSP 2.0.21-1.0.27 matches Kotlin 2.0.21 exactly (KSP versions are
#     Kotlin-version locked; do not bump one without the other).
#   * Hilt 2.52 supports Kotlin 2.0.x with KSP.
[versions]
agp = "8.7.3"
kotlin = "2.0.21"
ksp = "2.0.21-1.0.27"
hilt = "2.52"
coreKtx = "1.15.0"
lifecycle = "2.8.7"
activityCompose = "1.9.3"
composeBom = "2024.12.01"
navigation = "2.8.5"
room = "2.6.1"
datastore = "1.1.1"
paging = "3.3.5"
pagingCompose = "3.3.5"
work = "2.10.0"
hiltWork = "1.2.0"
hiltNavigationCompose = "1.2.0"
coil = "2.7.0"
camerax = "1.4.1"
media3 = "1.5.1"
biometric = "1.1.0"
exifinterface = "1.3.7"
securityCrypto = "1.1.0-alpha06"
firebaseBom = "33.7.0"
googleServices = "4.4.2"
playServicesAuth = "21.3.0"
coroutines = "1.9.0"
serialization = "1.7.3"
splashscreen = "1.0.1"
systemuicontroller = "0.36.0"
junit = "4.13.2"
mockk = "1.13.13"
turbine = "1.2.0"
androidxJunit = "1.2.1"
espresso = "3.6.1"
archCoreTesting = "2.2.0"
truth = "1.4.4"
